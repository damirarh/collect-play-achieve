# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Collect Play Achieve development tools
description: .NET SDK, Node, pnpm, and Aspire CLI for the project's development workflow.

args:
  dotnet_channel:
    default: "10.0"
    pattern: '^[0-9]+\.[0-9]+$'
    buildArg: DOTNET_CHANNEL
  node_version:
    default: "26.13.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: NODE_VERSION
  pnpm_version:
    default: "10.34.9"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: PNPM_VERSION
  aspire_version:
    default: "13.6.4"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: ASPIRE_VERSION

provides:
  - node@${{ kit.args.node_version }}
  - pnpm@${{ kit.args.pnpm_version }}
  - aspire-cli@${{ kit.args.aspire_version }}

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.nuget.org
          - "*.nuget.org"
          - registry.npmjs.org
          - nodejs.org
          - github.com
          - api.github.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
          - mcr.microsoft.com
          - "*.data.mcr.microsoft.com"
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command:
            - bash
            - -c
            - |
              set -euo pipefail
              line='. /etc/profile.d/collect-play-achieve-cpa.sh'
              if ! grep -Fxq "$line" /etc/sandbox-persistent.sh; then
                printf '\n%s\n' "$line" >> /etc/sandbox-persistent.sh
              fi
          user: "0"
          description: Add tool environment to interactive and non-interactive sandbox shells
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./context.md
